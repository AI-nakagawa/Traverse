<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f58"><meta name="description" content="2点の逆算から直線延長・方向変更・平行線を計算する現場用PWA"><title>現場座標ノート</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css?v=5"><link rel="stylesheet" href="enhancements.css?v=5"></head><body>
<header><div><p>FIELD SURVEY TOOL</p><h1>現場座標ノート</h1></div><button id="install" class="hidden">アプリを追加</button></header>
<main><nav><button class="nav active" data-view="calc">計算</button><button class="nav" data-view="history">保存履歴 <b id="historyCount">0</b></button></nav>
<section id="calcView" class="view active"><section class="card meta"><label>名称・現場名 <em>必須</em><input id="projectName" placeholder="例：○○工区 基準点測量"></label><label>日付<input id="date" type="date"></label></section>
<div class="workflow-label">逆トラバース・座標展開</div>
<section class="card mapCard"><div class="cardHead"><div><h2>測線図</h2><small>線をタップして基準線を選択</small></div><button id="pdf" disabled>PDF出力</button></div><svg id="map" viewBox="0 0 700 420" aria-label="測線図"></svg><div class="mapSummary"><span id="pointCount">0点</span><strong id="summary">未計算</strong></div></section>

<div id="traversePanel"><section id="initialCard" class="card"><h2>初期点</h2><div class="pointBlock"><h3>器械点</h3><div class="grid3"><label>点名<input id="stationName" placeholder="P1"></label><label>X（北）<input id="stationX" type="number" inputmode="decimal" step="any"></label><label>Y（東）<input id="stationY" type="number" inputmode="decimal" step="any"></label></div></div><div class="pointBlock"><h3>後視点</h3><div class="grid3"><label>点名<input id="backName" placeholder="BP"></label><label>X（北）<input id="backX" type="number" inputmode="decimal" step="any"></label><label>Y（東）<input id="backY" type="number" inputmode="decimal" step="any"></label></div></div></section>
<section class="card shotCard"><div id="currentLine" class="current hidden"></div><h2>求点を追加</h2><label>求点名<input id="targetName" placeholder="P2"></label><fieldset><legend>右回り夾角（度・分・秒）</legend><div class="dms"><label>度<input id="deg" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label><label>分<input id="min" type="number" inputmode="numeric" min="0" max="59" step="1" placeholder="0"></label><label>秒<input id="sec" type="number" inputmode="decimal" min="0" max="59.999999" step="any" placeholder="0"></label></div></fieldset><label>水平距離（m）<input id="distance" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label><div id="message" class="message"></div><button id="addShot" class="primary">求点を計算・追加</button></section></div>

<div id="reversePanel" class="hidden"><section class="card"><h2>2点の座標</h2><div class="pointBlock"><h3>始点</h3><div class="grid3"><label>点名<input id="fromName" placeholder="A"></label><label>X（北）<input id="fromX" type="number" inputmode="decimal" step="any"></label><label>Y（東）<input id="fromY" type="number" inputmode="decimal" step="any"></label></div></div><div class="pointBlock"><h3>終点</h3><div class="grid3"><label>点名<input id="toName" placeholder="B"></label><label>X（北）<input id="toX" type="number" inputmode="decimal" step="any"></label><label>Y（東）<input id="toY" type="number" inputmode="decimal" step="any"></label></div></div><div id="reverseMessage" class="message"></div><button id="addReverse" class="primary">逆算して基準線に設定</button></section><section id="applicationCard" class="card hidden"><div id="baselineInfo" class="current"></div><h2>基準線から座標を求める</h2><div class="appModes"><button class="appMode active" data-app="extension">直線延長</button><button class="appMode" data-app="turn">方向変更</button><button class="appMode" data-app="parallel">平行線</button></div><div id="singleTargetFields"><label>3点目の点名<input id="appPoint3" placeholder="P3"></label><label>2点目からの距離（m）<input id="appDistance" type="number" inputmode="decimal" min="0" step="any" placeholder="40.000"></label></div><fieldset id="turnFields" class="hidden"><legend>後視方向から時計回りの夾角</legend><div class="dms"><label>度<input id="appDeg" type="number" min="0" step="1"></label><label>分<input id="appMin" type="number" min="0" max="59" step="1"></label><label>秒<input id="appSec" type="number" min="0" max="59.999999" step="any"></label></div></fieldset><div id="parallelFields" class="hidden"><div class="grid3"><label>3点目<input id="parallelP3" placeholder="P3"></label><label>4点目<input id="parallelP4" placeholder="P4"></label><label>離れ（m）<input id="offset" type="number" inputmode="decimal" min="0" step="any"></label></div><fieldset><legend>1点目→2点目の進行方向に対して</legend><div class="sideChoice"><label><input type="radio" name="side" value="left">左側</label><label><input type="radio" name="side" value="right" checked>右側</label></div></fieldset></div><div id="applicationMessage" class="message"></div><button id="calculateApplication" class="primary">座標を計算・追加</button></section></div>

<section id="resultsCard" class="card hidden"><div class="cardHead"><h2>計算一覧</h2><button id="undo" class="dangerText">最後を戻す</button></div><div class="tableWrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></section>
<section class="card"><label>メモ<textarea id="memo" rows="3" placeholder="観測条件、器械高、注意事項など"></textarea></label></section><div class="sticky"><button id="newBtn">新規</button><button id="save" class="primary">計算を保存</button></div></section>

<section id="historyView" class="view"><h2>保存履歴</h2><div id="historyList"></div><div id="empty"><h3>まだ記録がありません</h3><p>計算結果を現場単位で保存できます。</p></div><details class="card backup"><summary>データ出力・バックアップ</summary><div><button id="csv">CSV出力</button><button id="json">JSON保存</button><label>JSONから復元<input id="import" type="file" accept=".json,application/json"></label></div></details></section></main>
<section id="printSheet"></section><div id="toast"></div><dialog id="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div><button id="cancel">キャンセル</button><button id="accept" class="danger">実行</button></div></dialog><script src="app.js?v=5" defer></script></body></html>
